version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: task-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskdb}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./src/main/resources/db/taskdb.sql:/docker-entrypoint-initdb.d/taskdb.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-task-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-taskdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
